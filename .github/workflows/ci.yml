name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -B -m unittest discover -s tests -t . -v
      - run: ruff check src tests scripts formal/check.py
      - run: ruff format --check src tests scripts formal/check.py

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_release.py dist
      - name: Install from the exact Git commit in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/vcs-test"
          "$RUNNER_TEMP/vcs-test/bin/python" -m pip install --no-deps "git+file://${GITHUB_WORKSPACE}@${GITHUB_SHA}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/vcs-test/bin/fabric-merge" --version
          "$RUNNER_TEMP/vcs-test/bin/python" -m fabric_merge --help
          "$RUNNER_TEMP/vcs-test/bin/fabric-merge" merge --left "$GITHUB_WORKSPACE/examples/left-definition-v2.json" --right "$GITHUB_WORKSPACE/examples/right-definition-v2.json" --name 'VCS install smoke' --out "$RUNNER_TEMP/vcs-merge.json"
      - name: Install wheel in an isolated environment outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/fabric-merge" --version
          "$RUNNER_TEMP/wheel-test/bin/python" -m fabric_merge --help
      - name: Rebuild and test from source distribution
        run: |
          mkdir "$RUNNER_TEMP/from-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/from-sdist"
          cd "$RUNNER_TEMP"/from-sdist/fabric_semantic_merge-*
          python -m pip install -e '.[dev]'
          python -B -m unittest discover -s tests -t . -v
          python -m build
          python scripts/check_release.py dist

  windows-install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install .
      - run: fabric-merge --version
      - run: python -m fabric_merge --help
